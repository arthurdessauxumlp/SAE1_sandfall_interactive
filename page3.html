<script>
/* ==========================================================================
   1. INITIALISATION DU CARROUSEL
   ========================================================================== */

// Indice de la diapositive actuellement affichée (commence à 1)
let slideIndex = 1;

// Lancement du carrousel au chargement de la page
showSlides(slideIndex);


/* ==========================================================================
   2. FONCTIONS DE NAVIGATION (ÉVÉNEMENTS)
   ========================================================================== */

/**
 * Avance ou recule d'un nombre 'n' de diapositives (boutons Précédent / Suivant)
 */
function plusSlides(n) {
  showSlides(slideIndex += n);
}

/**
 * Affiche directement la diapositive 'n' (clic sur un point de navigation)
 */
function currentSlide(n) {
  showSlides(slideIndex = n);
}


/* ==========================================================================
   3. MOTEUR D'AFFICHAGE DU SLIDESHOW
   ========================================================================== */

/**
 * Gère le masquage/affichage des images et la mise à jour des points de navigation
 */
function showSlides(n) {
  // Récupération de tous les éléments du slider dans le DOM
  let slides = document.getElementsByClassName("mySlides");
  let dots = document.getElementsByClassName("dot");
  
  // Boucle de défilement : si on dépasse la dernière image, on revient à la première
  if (n > slides.length) { 
    slideIndex = 1; 
  }    
  
  // Si on remonte avant la première image, on passe à la dernière
  if (n < 1) { 
    slideIndex = slides.length; 
  }
  
  // Masque toutes les diapositives
  for (let i = 0; i < slides.length; i++) {
    slides[i].style.display = "none";  
  }
  
  // Retire la classe "active" de tous les points de navigation
  for (let i = 0; i < dots.length; i++) {
    dots[i].className = dots[i].className.replace(" active", "");
  }
  
  // Affiche la diapositive courante et active le point correspondant
  slides[slideIndex - 1].style.display = "block";  
  dots[slideIndex - 1].className += " active";
}
</script>
